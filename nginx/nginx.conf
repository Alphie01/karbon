server {
    listen 80;
    server_name karbon.monolithsoftware.com.tr _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/font-woff2 image/svg+xml;
    gzip_min_length 1000;
    gzip_proxied any;

    client_max_body_size 50M;

    # Next.js static assets — agresif cache
    location /_next/static/ {
        proxy_pass http://app:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public dosyalar
    location /public/ {
        proxy_pass http://app:3000;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Ana proxy
    location / {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;

        # WebSocket desteği
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Gerçek IP ve protokol bilgisini uygulamamaya ilet
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;

        # Buffer ayarları
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      4 32k;
    }
}
