services:
  db:
    image: postgres:16-alpine
    container_name: ecopilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecopilot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-ecopilot_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecopilot_user} -d ${POSTGRES_DB:-ecopilot_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecopilot-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ecopilot_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-ecopilot_db}"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://karbon.monolithsoftware.com.tr}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      APP_DOMAIN: "karbon.monolithsoftware.com.tr"
      NODE_ENV: production

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: ecopilot-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ecopilot_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-ecopilot_db}"
    command: sh -c 'npx prisma db push --url "$$DATABASE_URL"'
    profiles:
      - tools

  nginx:
    image: nginx:1.27-alpine
    container_name: ecopilot-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
